name: Trigger Netlify deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-deploy:
    if: github.actor == 'danfessler'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Netlify build hook
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: curl --fail --show-error --silent --request POST --data '' "$NETLIFY_BUILD_HOOK_URL"
