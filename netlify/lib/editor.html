<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Daisy Hatchet Editor</title><link rel="icon" href="/favicon-daisy-hatchet.png"><link rel="stylesheet" href="/editor-assets/editor.css"></head><body><header class="bar"><h1>Daisy Hatchet Editor</h1><nav class="actions"><a class="preview" href="/editor/shop" data-editor="shop">Shop</a><a class="preview" href="/editor/gallery" data-editor="gallery">Gallery</a><a class="preview" id="live-link" href="/shop/" target="_blank" rel="noopener">View live site ↗</a><button class="save" id="publish" disabled>Save and publish</button><button class="preview" id="logout">Sign out</button></nav></header>
<section class="notice"><p id="intro">Loading your latest content…</p><span id="status" class="status" role="status" aria-live="polite"></span><button id="reload" hidden>Reload latest content</button></section>
<main class="grid" id="grid"></main><div class="bottom"><button class="add" id="add" disabled>+ Add arrangement</button> <button class="upload" id="upload" disabled>Upload photo</button><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden><p class="help">New photos are published only when you choose Save and publish. Keep this tab open until then.</p></div>
<dialog class="picker" id="picker"><div class="picker-head"><h2>Choose a photo</h2><button id="close-picker" class="picker-close" aria-label="Close photo picker">×</button></div><div class="picker-grid" id="picker-grid"></div></dialog>
<dialog class="auth-dialog" id="auth"><form id="auth-form"><h2>Sign in again</h2><p>Your edits are still here. Enter the admin password to continue.</p><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><p id="auth-error" role="alert"></p><button>Sign in</button><button type="button" id="cancel-auth">Cancel</button></form></dialog>
<script type="module" src="/editor-assets/editor.js"></script></body></html>
